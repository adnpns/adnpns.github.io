<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive"><title>Privé</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--void:#0c0b0a;--alt:#151312;--ink:#e9e4d8;--soft:#8c8577;--line:#3a362f;--acc:#d97a4f}
*{box-sizing:border-box}body{margin:0;background:var(--void);color:var(--ink);font:16px/1.55 Georgia,serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
.m{font:11px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
h1{font-weight:400;font-size:34px;margin:8px 0}h2{font-weight:400;font-size:26px;margin:48px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
h3{font:500 12px 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin:28px 0 8px}
.lede{font-size:18px}a{color:var(--ink)}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
nav a,button{font:12px 'DM Mono',monospace;color:var(--ink);background:var(--alt);border:1px solid var(--line);padding:8px 10px;border-radius:4px;text-decoration:none;cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc)}
.p{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.p .t b{display:block;font-weight:400}.p.forte .t b{color:#fff}.doute{display:block;color:var(--acc);font:11px 'DM Mono',monospace}
.px{text-align:right;white-space:nowrap}.px s{color:var(--soft);font-size:13px;margin-right:6px}
.new{font:500 18px 'DM Mono',monospace;color:var(--acc);border-bottom:1px dashed var(--acc);padding:0 2px;outline:none}
.cks{grid-column:1/-1;display:flex;gap:14px}
.ck{display:inline-flex;align-items:center;gap:6px;font:12px 'DM Mono',monospace;color:var(--soft);margin:4px 0}
.ck input{width:20px;height:20px;accent-color:var(--acc)}.ck input:checked+span{color:var(--ink)}
.p.vendu{opacity:.4}.p.vendu .t b{text-decoration:line-through}
.jour{background:var(--alt);border:1px solid var(--line);padding:4px 14px 10px;margin:12px 0;border-radius:6px}
.jour p{user-select:text}ul{padding-left:20px}li{margin:4px 0}
details.tache{border:1px solid var(--line);border-radius:6px;margin:10px 0;background:var(--alt)}
details.tache summary{list-style:none;cursor:pointer;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.tache summary::after{content:'+';margin-left:auto;color:var(--acc);font:18px 'DM Mono',monospace}details.tache[open] summary::after{content:'−'}
details.tache summary b{font-weight:400}details.tache>*:not(summary){margin-left:12px;margin-right:12px}
details.tache.fait summary b{text-decoration:line-through;color:var(--soft)}
ol{padding-left:20px}ol li{margin:6px 0}.acc{color:var(--acc)}
.cp{border-left:2px solid var(--acc);padding:4px 0 4px 10px;margin:10px 0}.cp p{margin:0 0 8px;user-select:text}
a.go{display:inline-block;margin:4px 8px 4px 0;font:12px 'DM Mono',monospace;color:var(--acc);text-decoration:none;border:1px solid var(--acc);padding:8px 10px;border-radius:4px}
a.mini{color:var(--acc);font-size:11px;margin-left:6px}h4{font:500 11px 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:16px 0 6px}
.dm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.dm input{flex:1 1 140px;min-width:0;font:14px 'DM Mono',monospace;padding:8px;background:var(--void);color:var(--ink);border:1px solid var(--line);border-radius:4px}
textarea{width:calc(100% - 24px);min-height:60px;margin:10px 12px 12px;font:14px Georgia,serif;padding:8px;background:var(--void);color:var(--ink);border:1px solid var(--line);border-radius:4px}
button.ok{border-color:var(--acc);color:var(--acc)}
#porte{max-width:360px;margin:20vh auto;padding:0 16px;text-align:center}
#porte input{width:100%;font:18px 'DM Mono',monospace;padding:12px;background:var(--alt);color:var(--ink);border:1px solid var(--line);border-radius:4px;text-align:center}
#erreur{color:var(--acc);min-height:1.5em}
</style><link rel="stylesheet" href="https://adrienpons.com/qg-d4bd3c8e/kit.css"></head><body>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function ouvrir(code){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c)));
}
const store={get(k){try{return localStorage.getItem('adnp:'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('adnp:'+k,v)}catch(e){}}};
function lancer(h){
  document.getElementById('porte').remove();const app=document.getElementById('app');app.innerHTML=h;app.hidden=false;
  app.querySelectorAll('input[type=checkbox][data-k]').forEach(i=>{i.checked=store.get(i.dataset.k)==='1';i.onclick=ev=>ev.stopPropagation();i.onchange=()=>{store.set(i.dataset.k,i.checked?'1':'0');app.querySelectorAll('input[data-k="'+i.dataset.k+'"]').forEach(x=>x.checked=i.checked);maj()}});
  app.querySelectorAll('textarea[data-k],input:not([type=checkbox])[data-k]').forEach(i=>{i.value=store.get(i.dataset.k)||'';i.oninput=()=>store.set(i.dataset.k,i.value)});
  app.querySelectorAll('summary label').forEach(l=>l.onclick=ev=>ev.stopPropagation());
  app.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
    if(b.dataset.copy){const t=document.getElementById(b.dataset.copy).innerText;const fin=()=>{const o=b.textContent;b.textContent='Copié ✓';b.classList.add('ok');setTimeout(()=>{b.textContent=o;b.classList.remove('ok')},1500)};navigator.clipboard.writeText(t).then(fin,()=>prompt('Copie ce texte :',t))}
    if(b.dataset.ig){const v=(store.get(b.dataset.ig)||'').trim().replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//,'').replace(/\/.*$/,'');window.open(v?'https://ig.me/m/'+encodeURIComponent(v):'https://www.instagram.com/direct/inbox/','_blank')}});
  app.querySelectorAll('.new').forEach(s=>{const v=store.get(s.dataset.k);if(v)s.textContent=v;s.oninput=()=>{store.set(s.dataset.k,s.textContent.replace(/\D/g,''));maj()}});
  let filtre='tout';
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filtre=b.dataset.f;app.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b));maj()});
  function maj(){app.querySelectorAll('details.tache').forEach(d=>{const c=d.querySelector('summary input');if(c)d.classList.toggle('fait',c.checked)});let n=0,ca=0,la=0;
    app.querySelectorAll('.p').forEach(p=>{const r=p.dataset.ref,v=store.get('v-'+r)==='1',l=store.get('la-'+r)==='1';p.classList.toggle('vendu',v);
      if(v){n++;ca+=+(p.querySelector('.new').textContent)||0}if(l)la++;
      p.hidden=(filtre==='forte'&&!p.classList.contains('forte'))||(filtre==='la'&&!l)||(filtre==='reste'&&(l||v));});
    document.getElementById('total').textContent=`En boutique : ${la} · Vendus : ${n} pour ${ca} €`;}
  document.getElementById('copier').onclick=()=>{const L=[];app.querySelectorAll('.p').forEach(p=>{const r=p.dataset.ref,e=[];
    if(store.get('la-'+r)==='1')e.push('là');if(store.get('ph-'+r)==='1')e.push('photo');if(store.get('v-'+r)==='1')e.push('vendu');
    const px=store.get('prix-'+r);if(px)e.push('prix '+px);if(e.length)L.push(r+' : '+e.join(', '))});
    const t=L.join('\n')||'Aucun changement';navigator.clipboard.writeText(t).then(()=>alert('Copié ! Colle-le dans la conversation.'),()=>prompt('Copie ce texte :',t))};
  maj();
}
const f=document.getElementById('f');
f.onsubmit=async e=>{e.preventDefault();const c=document.getElementById('code').value.trim();
  try{const h=await ouvrir(c);store.set('code',c);lancer(h)}catch(_){document.getElementById('erreur').textContent='Code incorrect'}};
const c0=store.get('code');if(c0)ouvrir(c0).then(lancer).catch(()=>{});
