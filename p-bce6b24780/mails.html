<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Mails prêts</title>
<style>
:root{--bg:#f4f3f1;--ink:#1c1c1c;--mute:#6b6b6b;--line:#dcdad6;--card:#fff;--acc:#1c1c1c}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--ink:#ecebe8;--mute:#9a9893;--line:#2c2b29;--card:#1d1d1c;--acc:#ecebe8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,Helvetica,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}h1{font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:8px 0 4px}h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;margin:32px 0 10px;border-top:1px solid var(--line);padding-top:18px}
.sub{color:var(--mute);font-size:14px;margin:0 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 14px;margin:10px 0}
.card h3{margin:0 0 4px;font-size:16px}.meta{color:var(--mute);font-size:13px}.btn{display:inline-block;margin:8px 8px 0 0;padding:8px 12px;border:1px solid var(--ink);border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;background:none;cursor:pointer}
.btn.fill{background:var(--acc);color:var(--bg)}pre{white-space:pre-wrap;font:14px/1.5 inherit;font-family:inherit;margin:8px 0 0;background:var(--bg);padding:10px;border-radius:8px}
label.chk{display:flex;gap:10px;align-items:flex-start}label.chk input{margin-top:5px;transform:scale(1.2)}.done{opacity:.45}nav a{margin-right:14px;color:var(--ink);font-size:14px}
#gate{max-width:360px;margin:20vh auto;padding:0 16px}#gate input{width:100%;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}#err{color:#b33;font-size:14px}
select{font-size:14px;padding:4px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
</style></head><body>
<div id="gate"><p class="sub">Espace privé</p><input id="code" type="password" placeholder="Code d'accès" autocomplete="current-password"><p id="err"></p><button class="btn fill" id="go">Ouvrir</button></div>
<main id="app" hidden></main>
