<style>

// Couche « belle et interactive » commune aux pages privées adrienpons.com (Carrière, QG, Permis, Trésorerie).
// Injectée telle quelle dans chaque page ; uiPlus(main) s'appelle une fois le contenu déchiffré.
// Ajoute : barre de progression x/y collée en haut, sections repliables avec compteur (état mémorisé),

#m,#app{animation:upIn .35s ease}@keyframes upIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#prog{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;margin:4px 0 6px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
#prog span{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}#prog i{display:block;height:100%;width:0;background:var(--acc);border-radius:8px;transition:width .4s ease}
input.uf{width:100%;font-size:16px;padding:10px 12px;margin:4px 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card,transparent);color:var(--ink,var(--fg))}
section.sec{margin-top:22px;border-top:1px solid var(--line)}
button.tete{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:16px 0 10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.tete .t{flex:1;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
button.tete .cpt{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:20px;padding:5px 9px;color:var(--mute,var(--mut))}
button.tete .cpt:empty{display:none}button.tete .cpt.ok{background:var(--acc);border-color:var(--acc);color:var(--bg)}
button.tete .fl{transition:transform .25s ease;color:var(--mute,var(--mut))}section.ferme .fl{transform:rotate(-90deg)}
button.tete:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
section.sec .corps{animation:upIn .3s ease}section.ferme .corps{display:none}
.card,.box,ul.todo li{transition:opacity .25s ease}
.card:has(input[type=checkbox][data-k]:checked),ul.todo li:has(input:checked){opacity:.5}
.btn,button.cp{transition:transform .1s ease}.btn:active,button.cp:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}`;
