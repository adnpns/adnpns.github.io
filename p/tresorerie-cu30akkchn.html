<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Espace privé</title>
<style>
:root{--bg:#0e0e0e;--fg:#f2efe9;--mut:#a29d95;--line:#2c2a27;--acc:#e8d9b5;--alert:#3a1f1a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,Helvetica,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;margin:8px 0}h2{font-size:18px;margin:32px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.sub,.small{color:var(--mut);font-size:14px}.who{font-weight:600;margin:16px 0 4px}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0}.alert{background:var(--alert)}
blockquote.copy{margin:6px 0 4px;padding:12px 14px;background:#1a1917;border-left:3px solid var(--acc);border-radius:6px;position:relative}
button.cp{display:block;margin:0 0 10px auto;background:none;border:1px solid var(--line);color:var(--acc);border-radius:6px;padding:4px 10px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:500}
ul.todo{list-style:none;padding:0}ul.todo li{margin:8px 0}ul.todo input{transform:scale(1.25);margin-right:8px}
details.task{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:#141312;transition:opacity .25s}
details.task:has(summary input:checked){opacity:.55}
details.task summary{list-style:none;cursor:pointer;padding:14px;display:flex;align-items:center;gap:10px;font-weight:600}
details.task summary::-webkit-details-marker{display:none}details.task summary::after{content:"▾";margin-left:auto;color:var(--mut);transition:transform .2s}
details.task[open] summary::after{transform:rotate(180deg)}details.task summary input{transform:scale(1.3);flex:none}
details.task>*:not(summary){margin-left:14px;margin-right:14px}details.task>*:last-child{margin-bottom:14px}
.tag{font-size:12px;font-weight:500;color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
ol{padding-left:22px}ol li{margin:4px 0}ul.papiers{padding-left:20px;font-size:15px}
a.btn{display:inline-block;margin:6px 6px 6px 0;padding:10px 14px;border-radius:10px;background:var(--acc);color:#111;text-decoration:none;font-weight:600;font-size:15px}
a.btn.ghost{background:none;color:var(--acc);border:1px solid var(--line)}
textarea{display:block;width:calc(100% - 28px);min-height:70px;margin-top:10px;padding:10px;border-radius:8px;border:1px solid var(--line);background:#1a1917;color:var(--fg);font:15px/1.4 inherit}
#gate{max-width:360px;margin:20vh auto;padding:0 16px;text-align:center}#gate input{width:100%;font-size:20px;padding:10px;border-radius:8px;border:1px solid var(--line);background:#1a1917;color:var(--fg);text-align:center;letter-spacing:4px}
#gate button{margin-top:12px;width:100%;padding:10px;font-size:16px;border-radius:8px;border:0;background:var(--acc);color:#111}#err{color:#e08a7a;min-height:1.4em}
</style></head><body>
<div id="gate"><p>Espace privé</p><form id="f"><input id="c" type="password" inputmode="text" autocomplete="off" placeholder="Code"><button>Ouvrir</button></form><p id="err"></p></div>

const u=b=>Uint8Array.from(atob(b),x=>x.charCodeAt(0));
async function open_(code){const e=new TextEncoder();const b=await crypto.subtle.importKey("raw",e.encode(code),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},b,{name:"AES-GCM",length:256},false,["decrypt"]);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c)));}
function show(html){const m=document.getElementById("m");m.innerHTML=html;m.hidden=false;document.getElementById("gate").remove();
const P="tres-"+location.pathname;let st={};try{st=JSON.parse(localStorage.getItem(P)||"{}")}catch(e){}
const sv=()=>{try{localStorage.setItem(P,JSON.stringify(st))}catch(e){}};
m.querySelectorAll("input[data-k]").forEach(i=>{i.checked=!!st[i.dataset.k];i.onclick=e=>e.stopPropagation();i.onchange=()=>{st[i.dataset.k]=i.checked;sv()}});
m.querySelectorAll("textarea[data-n]").forEach(t=>{t.value=st[t.dataset.n]||"";t.oninput=()=>{st[t.dataset.n]=t.value;sv()}});
m.querySelectorAll("blockquote.copy").forEach(q=>{const b=document.createElement("button");b.className="cp";b.textContent="Copier";
b.onclick=()=>{navigator.clipboard.writeText(q.innerText).then(()=>{b.textContent="Copié ✓";setTimeout(()=>b.textContent="Copier",1500)})};q.after(b)});
try{uiPlus(m)}catch(e){}}
// Couche « belle et interactive » commune aux pages privées adrienpons.com (Carrière, QG, Permis, Trésorerie).
// Injectée telle quelle dans chaque page ; uiPlus(main) s'appelle une fois le contenu déchiffré.
// Ajoute : barre de progression x/y collée en haut, sections repliables avec compteur (état mémorisé),
// filtre texte dès 15 éléments, cartes grisées une fois faites, transitions légères.
function uiPlus(m){
const css=`
#m,#app{animation:upIn .35s ease}@keyframes upIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#prog{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;margin:4px 0 6px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
#prog span{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}#prog i{display:block;height:100%;width:0;background:var(--acc);border-radius:8px;transition:width .4s ease}
input.uf{width:100%;font-size:16px;padding:10px 12px;margin:4px 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card,transparent);color:var(--ink,var(--fg))}
section.sec{margin-top:22px;border-top:1px solid var(--line)}
button.tete{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:16px 0 10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.tete .t{flex:1;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
button.tete .cpt{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:20px;padding:5px 9px;color:var(--mute,var(--mut))}
button.tete .cpt:empty{display:none}button.tete .cpt.ok{background:var(--acc);border-color:var(--acc);color:var(--bg)}
button.tete .fl{transition:transform .25s ease;color:var(--mute,var(--mut))}section.ferme .fl{transform:rotate(-90deg)}
button.tete:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
section.sec .corps{animation:upIn .3s ease}section.ferme .corps{display:none}
.card,.box,ul.todo li{transition:opacity .25s ease}
.card:has(input[type=checkbox][data-k]:checked),ul.todo li:has(input:checked){opacity:.5}
.btn,button.cp{transition:transform .1s ease}.btn:active,button.cp:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}`;
const s0=document.createElement("style");s0.textContent=css;document.head.appendChild(s0);
const K="ui-"+location.pathname;let st={};try{st=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}};
const boxes=()=>[...m.querySelectorAll("input[type=checkbox][data-k]")];
const h1=m.querySelector("h1");
if(h1&&boxes().length){const p=document.createElement("div");p.id="prog";p.innerHTML="<b></b><span><i></i></span>";
const n=h1.nextElementSibling;(n&&n.classList.contains("sub")?n:h1).after(p)}
m.querySelectorAll(":scope > h2").forEach((h,n)=>{const s=document.createElement("section");s.className="sec";
const c=document.createElement("div");c.className="corps";h.before(s);let x=h.nextSibling;
while(x&&!(x.nodeType===1&&x.tagName==="H2")){const y=x.nextSibling;c.appendChild(x);x=y}
const b=document.createElement("button");b.className="tete";b.type="button";b.innerHTML='<span class="t"></span><span class="cpt"></span><span class="fl">▾</span>';
b.querySelector(".t").innerHTML=h.innerHTML;h.replaceWith(b);s.append(b,c);const k="s"+n;if(st[k])s.classList.add("ferme");
b.setAttribute("aria-expanded",!st[k]);b.onclick=()=>{const f=s.classList.toggle("ferme");b.setAttribute("aria-expanded",!f);st[k]=f;save()}});
const items=[...m.querySelectorAll(".card, .box, ul.todo li, table tr:not(:first-child)")];
if(items.length>=15){const f=document.createElement("input");f.className="uf";f.type="search";f.placeholder="🔍 Filtrer";
(document.getElementById("prog")||h1||m.firstChild).after(f);
f.oninput=()=>{const q=f.value.trim().toLowerCase();items.forEach(e=>e.hidden=!!q&&!e.textContent.toLowerCase().includes(q));
if(q)m.querySelectorAll("section.sec").forEach(s=>s.classList.remove("ferme"))}}
const maj=()=>{const a=boxes(),p=document.getElementById("prog");
if(p&&a.length){const d=a.filter(i=>i.checked).length;p.querySelector("b").textContent=d+" / "+a.length+" faits";p.querySelector("i").style.width=(100*d/a.length)+"%"}
m.querySelectorAll("section.sec").forEach(s=>{const l=[...s.querySelectorAll("input[type=checkbox][data-k]")],c=s.querySelector(".cpt");
if(!l.length){c.textContent="";return}const d=l.filter(i=>i.checked).length;c.textContent=d+"/"+l.length;c.classList.toggle("ok",d===l.length)})};
m.addEventListener("change",e=>{if(e.target.matches("input[type=checkbox]"))maj()});maj();
}

document.getElementById("f").onsubmit=async ev=>{ev.preventDefault();const c=document.getElementById("c").value.trim();
try{const h=await open_(c);try{sessionStorage.setItem("tres-code",c)}catch(e){}show(h)}catch(e){document.getElementById("err").textContent="Code incorrect"}};
(async()=>{let c=null;try{c=sessionStorage.getItem("tres-code")}catch(e){}if(c){try{show(await open_(c))}catch(e){}}})();
</script></body></html>
